<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SOS ALIMENTOS</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <main class="page-shell">
        <section id="reset-section" class="login-card">
            <div class="selo" aria-hidden="true">recuperação<br>de conta</div>

            <p class="eyebrow">Recuperação de conta</p>
            <h1><span>SOS</span> ALIMENTOS🍎</h1>
            <p class="subtitle">Digite seu usuário e defina uma nova senha.</p>

            <form id="reset-form">
                <label for="usuario-reset">Usuário</label>
                <input type="text" id="usuario-reset" name="usuario" placeholder="Digite seu nome de usuário" required />

                <label for="senha-reset">Nova senha</label>
                <input type="password" id="senha-reset" name="senha" placeholder="Digite a nova senha" minlength="6" required />

                <label for="confirm-senha-reset">Confirmar nova senha</label>
                <input type="password" id="confirm-senha-reset" name="confirm-senha" placeholder="Digite a nova senha novamente" minlength="6" required />

                <button type="submit" id="reset-button">Redefinir senha</button>
                <p id="reset-message" aria-live="polite" style="display: none"></p>
            </form>
        </section>
    </main>
    <script src="index.js" defer></script>
</body>

</html>
