<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REGISTRO de Nota SOS</title>
    <link rel="stylesheet" href="entrega.css">
</head>

<body>

    <header class="topo">
        <span class="topo-titulo">SOS Alimentos</span>
        <button type="button" id="btnSair" class="btn-sair">Sair</button>
    </header>

    <main class="container">

        <div class="card-entrega">

            <h2>Registrar Entrega</h2>
            <p>Preencha os dados abaixo para enviar a nota.</p>

            <form id="form-entrega">

                <div class="campo">
                    <label for="cliente">Cliente</label>
                    <div class="autocomplete">
                        <input type="text" id="cliente" name="cliente" placeholder="Digite ou selecione um cliente"
                            autocomplete="off" required>
                        <div id="lista-clientes" class="autocomplete-list"></div>
                    </div>
                </div>

                <div class="campo">
                    <label for="valorNota">Valor da Nota (R$)</label>
                    <input type="number" id="valorNota" name="valorNota" placeholder="0,00" step="0.01" min="0"
                        required>
                </div>

                <div class="campo">
                    <label for="imagemNota">Imagem da Nota Fiscal</label>
                    <div class="campo-arquivo">
                        <label for="imagemNota" class="btn-arquivo">Escolher arquivo</label>
                        <span id="nomeArquivo" class="nome-arquivo">Nenhum arquivo selecionado</span>
                        <input type="file" id="imagemNota" name="img" accept="image/*" capture="environment"
                            class="input-arquivo-oculto">
                    </div>
                </div>

                <button type="submit" id="btnEnviar">
                    Enviar
                </button>

            </form>

        </div>
    </main>
    <script src="entrega.js" defer></script>
    <script>
        // Evento de Logout
        document.getElementById("btnSair").addEventListener("click", async (event) => {
            event.preventDefault();
            try {
                await fetch("https://sos-alimentos-servidor.onrender.com/api/auth/logout", {
                    method: "POST",
                    credentials: "include",
                });
            } catch (erro) {
                console.error("Erro ao fazer logout na API:", erro);
            } finally {
                sessionStorage.clear();
                window.location.href = "../login/login.html";
            }
        });
    </script>
</body>

</html>
